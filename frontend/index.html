<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Align browser chrome (mobile URL bar, PWA shell) with the canvas background. -->
    <meta name="theme-color" content="#f7f8fa" />
    <!-- The mono font is the app's only family and renders above-the-fold text —
         preload it so first paint doesn't wait on the CSS → @font-face chain. -->
    <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('eniac_theme') || localStorage.getItem('theme');
          var isBlack = stored === 'black';
          var isDark = isBlack || stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (isBlack) document.documentElement.classList.add('black');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isBlack ? '#000000' : '#090d16');
          }
        } catch (e) {}
      })();
    </script>
    <title>Eniac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
